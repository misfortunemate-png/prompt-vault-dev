name: Issue Verifier

on:
  pull_request:
    paths:
      - 'scripts/verify-issues.mjs'
      - 'tests/issues/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/issue-verifier.yml'
  workflow_dispatch:

jobs:
  verify-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run verify:issues -- --json
